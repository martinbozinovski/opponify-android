name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x ./gradlew
      - name: Generate ephemeral CI signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/opponify-ci.jks" -storepass changeit -keypass changeit -alias opponify-ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Opponify CI"
      - name: Build, test, lint, and production release artifact
        run: ./gradlew clean test lint assembleDevDebug assembleProductionRelease --no-daemon -POPPONIFY_PRODUCTION_API_BASE_URL=https://staging.invalid/
        env:
          OPPONIFY_KEYSTORE_PATH: ${{ runner.temp }}/opponify-ci.jks
          OPPONIFY_KEYSTORE_PASSWORD: changeit
          OPPONIFY_KEY_ALIAS: opponify-ci
          OPPONIFY_KEY_PASSWORD: changeit
